[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Devakinandan Kurukundu", email = "devakinandan.kurukundu@4iapps.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "docx2txt>=0.9",
    "faiss-cpu>=1.15.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jq>=1.12.0",
    "jupyter>=1.1.1",
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langchain-experimental>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "matplotlib>=3.11.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pdfminer>=20191125",
    "pymupdf>=1.28.2",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.1",
    "tiktoken>=0.14.0",
    "unstructured>=0.27.5",
    "wikipedia>=1.4.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
